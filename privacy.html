<body><main><h1>EOS DataHub プライバシーポリシー</h1><p>EOS DataHubは、個人利用を目的とした投資データ管理・分析システムです。</p><h2>Googleユーザーデータの利用</h2><p>Google APIを通じて取得したユーザーデータは、EOS DataHubの機能提供、データ管理および分析のためにのみ使用します。</p><h2>第三者提供</h2><p>取得したGoogleユーザーデータを販売しません。また、法令に基づく場合を除き、EOS DataHubの機能提供に必要のない第三者へ提供しません。</p><h2>データの保護</h2><p>取得したデータは、個人利用のEOS DataHub環境内で適切に管理します。</p><p><a href="index.html">EOS DataHubへ戻る</a></p></main></body></html>
